# Compila a app e publica o APK na Release (quando se cria uma tag v* ou manualmente)
name: Publicar APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Versão (tag) onde publicar o APK"
        default: "v1.0.0"

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Aceitar licenças do Android SDK
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.0"

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "GameCollection-$TAG.apk"

      - name: Guardar APK no workflow
        uses: actions/upload-artifact@v4
        with:
          name: GameCollection-apk
          path: GameCollection-*.apk

      - name: Publicar na Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: GameCollection-*.apk
