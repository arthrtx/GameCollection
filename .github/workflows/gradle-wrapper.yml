# Gera os ficheiros do Gradle Wrapper (gradlew) se ainda não existirem no repositório
name: Gradle Wrapper

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar
        id: check
        run: if [ -f gradlew ]; then echo "existe=1" >> $GITHUB_OUTPUT; fi
      - uses: actions/setup-java@v4
        if: steps.check.outputs.existe != '1'
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        if: steps.check.outputs.existe != '1'
        with:
          gradle-version: "9.8.0"
      - name: Gerar e guardar wrapper
        if: steps.check.outputs.existe != '1'
        run: |
          mv settings.gradle.kts /tmp/s && echo 'rootProject.name = "tmp"' > settings.gradle.kts
          gradle wrapper --gradle-version 9.8.0 --no-daemon
          mv /tmp/s settings.gradle.kts
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper
          git commit -m "Adiciona Gradle Wrapper"
          git push
